<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-27資訊科技領袖生點名系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="radio"] { width: 1.5rem; height: 1.5rem; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen">

    <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center text-white flex-col">
        <div class="text-6xl mb-4 spinner">🔄</div>
        <div id="loading-text" class="text-xl font-bold tracking-wide">與雲端同步中...</div>
    </div>

    <!-- 登入畫面 -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
            <div class="text-5xl mb-4">💻</div>
            <h1 class="text-2xl font-bold text-blue-800 mb-2">IT Prefects 點名系統</h1>
            <form onsubmit="handleLogin(event)" class="space-y-5 text-left mt-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">登入名稱 (帳號)</label>
                    <input type="text" id="login-username" required class="w-full border-2 rounded-xl p-3 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">密碼</label>
                    <input type="password" id="login-password" required class="w-full border-2 rounded-xl p-3 outline-none focus:border-blue-500">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden font-medium text-center">❌ 帳號或密碼錯誤</div>
                <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold text-lg shadow-md">登入系統</button>
            </form>
        </div>
    </div>

    <!-- 系統主框架 -->
    <div id="app-container" class="hidden">
        <nav class="bg-blue-800 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center py-3">
                <div class="text-lg font-bold flex items-center gap-2 truncate">
                    <span id="current-user-display">IT Prefects</span>
                </div>
                <div class="flex space-x-2 overflow-x-auto no-scrollbar">
                    <button id="nav-teacher" onclick="switchTab('teacher')" class="nav-btn px-4 py-2 rounded-lg bg-blue-900 font-medium transition hidden">管理總覽</button>
                    <button id="nav-captain" onclick="switchTab('captain')" class="nav-btn px-4 py-2 rounded-lg hover:bg-blue-700 transition hidden">點名板</button>
                    <button id="nav-student" onclick="switchTab('student')" class="nav-btn px-4 py-2 rounded-lg hover:bg-blue-700 transition hidden">請假申請</button>
                    <button onclick="fetchLatestData()" class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 font-medium ml-2 text-sm">🔄 更新</button>
                    <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 font-medium transition ml-1">登出</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <!-- 1. 同學模式 (請假) -->
            <section id="role-student" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold mb-6 text-blue-800 border-b pb-3">📝 提交請假申請</h2>
                    <form id="leave-form" onsubmit="submitLeave(event)" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div><label class="block text-gray-700 mb-2 font-medium">請假日期</label><input type="date" id="leave-date" required class="w-full border-2 rounded-xl px-4 py-3 outline-none text-lg"></div>
                            <div><label class="block text-gray-700 mb-2 font-medium">假別</label><select id="leave-type" required class="w-full border-2 rounded-xl px-4 py-3 outline-none text-lg"><option value="病假">病假</option><option value="事假">事假</option></select></div>
                        </div>
                        <div><label class="block text-gray-700 mb-2 font-medium">請假原因 (最多100字)</label><textarea id="leave-reason" maxlength="100" required rows="3" class="w-full border-2 rounded-xl px-4 py-3 outline-none text-lg"></textarea></div>
                        <button type="submit" class="w-full bg-blue-600 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-md">確認提交</button>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-800">🕰️ 我的請假紀錄</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead class="bg-gray-100"><tr><th class="py-3 px-4">請假日期</th><th class="py-3 px-4">假別</th><th class="py-3 px-4">原因</th><th class="py-3 px-4 text-center">狀態</th><th class="py-3 px-4 text-center">操作</th></tr></thead>
                            <tbody id="student-leave-list" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 2. 隊長模式 (點名) -->
            <section id="role-captain" class="tab-section hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-col md:flex-row justify-between md:items-end mb-6 gap-4 border-b pb-4">
                        <div><h2 class="text-2xl font-bold text-purple-700 mb-2">📋 隊長點名板</h2></div>
                        <div class="flex flex-col items-end gap-2">
                            <input type="date" id="rollcall-date" class="border-2 rounded-xl px-4 py-2 outline-none font-bold text-lg" onchange="renderRollCallList()">
                            <div id="day-indicator" class="bg-purple-100 text-purple-800 px-3 py-1 rounded-lg font-medium text-sm">載入中...</div>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead class="bg-purple-50 text-purple-800"><tr><th class="py-3 px-4">姓名 (班別)</th><th class="py-3 px-4">當值位置</th><th class="py-3 px-4">狀態選擇</th></tr></thead>
                            <tbody id="rollcall-list" class="divide-y text-lg"></tbody>
                        </table>
                    </div>
                    <div class="mt-8 flex justify-end">
                        <button onclick="saveRollCall()" class="w-full md:w-auto bg-purple-600 text-white px-10 py-4 rounded-xl font-bold text-lg shadow-lg">💾 儲存點名紀錄至雲端</button>
                    </div>
                </div>
            </section>

            <!-- 3. 老師模式 (管理) -->
            <section id="role-teacher" class="tab-section hidden space-y-6">
                
                <!-- 待辦請假 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-orange-400">
                    <h2 class="text-xl font-bold mb-4 text-orange-600 flex items-center gap-2">⏳ 待處理請假單 <span id="pending-count" class="bg-orange-100 text-orange-700 text-sm px-3 py-1 rounded-full">0</span></h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse"><thead class="bg-gray-50"><tr><th class="py-3 px-4">學生</th><th class="py-3 px-4">日期</th><th class="py-3 px-4">假別與原因</th><th class="py-3 px-4 text-right">操作</th></tr></thead><tbody id="teacher-pending-leaves" class="divide-y"></tbody></table>
                    </div>
                </div>

                <!-- 帳號管理 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-4 gap-4">
                        <h2 class="text-xl font-bold text-blue-700">👩‍🎓 系統帳號與當值管理</h2>
                        <button onclick="saveAllUsers()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold w-full md:w-auto">💾 統一儲存變更至雲端</button>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-7 gap-2 mb-4 bg-blue-50 p-3 rounded-xl items-end text-sm">
                        <div><label class="text-xs text-gray-500">角色</label><select id="n-role" class="border p-2 w-full rounded-lg bg-white"><option value="student">同學</option><option value="captain">隊長</option><option value="teacher">老師</option></select></div>
                        <div><label class="text-xs text-gray-500">姓名</label><input type="text" id="n-name" class="border p-2 w-full rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">班別(學號)</label><input type="text" id="n-sid" class="border p-2 w-full rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">帳號</label><input type="text" id="n-un" class="border p-2 w-full rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">密碼</label><input type="text" id="n-pw" class="border p-2 w-full rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">當值星期 (例:1,3)</label><input type="text" id="n-day" placeholder="1=一, 2=二..." class="border p-2 w-full rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">位置</label><input type="text" id="n-loc" class="border p-2 w-full rounded-lg"></div>
                        <div class="col-span-2 md:col-span-7"><button onclick="addUser()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold w-full">＋ 新增</button></div>
                    </div>

                    <div class="mb-3"><input type="text" id="search-user" onkeyup="filterUsers()" placeholder="🔍 輸入姓名、學號或帳號快速搜尋..." class="w-full border-2 rounded-lg px-4 py-2 outline-none focus:border-blue-500"></div>

                    <div class="overflow-y-auto border rounded-xl max-h-[500px]">
                        <table class="w-full text-left border-collapse text-sm min-w-[800px]">
                            <thead class="bg-gray-100 sticky top-0 z-10"><tr><th class="py-2 px-3">姓名 / 班別(學號)</th><th class="py-2 px-3">登入帳號 / 密碼</th><th class="py-2 px-3">角色 / 星期 / 位置</th><th class="py-2 px-3 text-center w-24">操作</th></tr></thead>
                            <tbody id="teacher-user-manager" class="divide-y bg-white"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 累積統計 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mt-6">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                        <h2 class="text-xl font-bold text-indigo-700">📊 累積出席率統計</h2>
                        <div class="flex flex-wrap gap-2 items-center bg-indigo-50 p-2 rounded-lg">
                            <select id="stat-mode" onchange="toggleStatInputs()" class="border-2 rounded-lg px-3 py-2 outline-none font-medium"><option value="month">單一月份</option><option value="year">全年度</option><option value="range">自訂區間</option></select>
                            <input type="month" id="stat-month" class="border-2 rounded-lg px-3 py-2 outline-none stat-input block">
                            <select id="stat-year" class="border-2 rounded-lg px-3 py-2 outline-none stat-input hidden"><option value="2025">2025 年</option><option value="2026">2026 年</option></select>
                            <div id="stat-range-group" class="items-center gap-1 stat-input hidden flex"><input type="month" id="stat-start" class="border-2 rounded-lg px-2 py-2 text-sm"><span class="text-gray-500">至</span><input type="month" id="stat-end" class="border-2 rounded-lg px-2 py-2 text-sm"></div>
                            <button onclick="renderStats()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">🔍 查詢</button>
                            <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold ml-auto">📥 匯出 CSV</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-center border-collapse min-w-[600px]"><thead class="bg-indigo-50 text-indigo-800"><tr><th class="py-3 px-4 text-left">學生姓名</th><th class="py-3 px-4">應到(有紀錄)日數</th><th class="py-3 px-4 text-green-600">出席</th><th class="py-3 px-4 text-blue-600">請假</th><th class="py-3 px-4 text-red-600">缺席</th><th class="py-3 px-4 font-bold">出席率</th></tr></thead><tbody id="teacher-stats-list" class="divide-y"></tbody></table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 腳本 -->
    <script>
        // ================= ⚠️ 替換您的 Google Apps Script URL =================
        const API_URL = "https://script.google.com/macros/s/AKfycbycrJdV75tW-N2_nyO9CA3gAlpcJgJtdfL-vXRcfzhATPcn0CgAvVE2T5taGDA9Ij_MLg/exec"; 
        
        let db = { users: [], attendance: {}, leaves: [] };
        let currentUser = null;

        const getToday = () => { const tzOffset = (new Date()).getTimezoneOffset() * 60000; return (new Date(Date.now() - tzOffset)).toISOString().split('T')[0]; };
        const getCurrentMonth = () => getToday().substring(0, 7);
        const DAY_NAMES = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
        const LEAVE_STATUS = { pending: { label: '待審核', color: 'text-orange-600 bg-orange-100' }, approved: { label: '已批准', color: 'text-green-600 bg-green-100' }, rejected: { label: '已拒絕', color: 'text-red-600 bg-red-100' } };

        // ================= 核心連線功能 (增量更新) =================
        function showLoading(text) { document.getElementById('loading-text').innerText = text; document.getElementById('loading-overlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

        // 啟動載入
        window.onload = () => {
            document.getElementById('rollcall-date').value = getToday();
            document.getElementById('leave-date').value = getToday();
            document.getElementById('stat-month').value = getCurrentMonth();
            document.getElementById('stat-start').value = getCurrentMonth();
            document.getElementById('stat-end').value = getCurrentMonth();
            fetchLatestData();
        };

        async function fetchLatestData() {
            showLoading("與雲端同步中...");
            try {
                const response = await fetch(API_URL);
                db = await response.json();
                hideLoading();
                if(currentUser) switchTab(currentUser.role);
                else document.getElementById('login-screen').classList.remove('hidden');
            } catch (e) {
                hideLoading(); alert("⚠️ 連線失敗，請確認 API_URL！");
            }
        }

        // 發送動作指令給後端 (解決覆蓋問題)
        async function sendAction(payload) {
            showLoading("安全儲存中...");
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                if (result.status === 'success') {
                    db = result.data; // 儲存成功後，直接使用後端回傳的最新資料
                    hideLoading();
                    return true;
                } else throw new Error(result.error);
            } catch (e) {
                hideLoading(); alert("儲存失敗！"); return false;
            }
        }

        // ================= 登入 =================
        function handleLogin(e) {
            e.preventDefault();
            const un = document.getElementById('login-username').value.trim();
            const pw = document.getElementById('login-password').value.trim();
            const user = db.users.find(u => u.username === un && u.password === pw);
            if (user) { document.getElementById('login-error').classList.add('hidden'); login(user); } 
            else { document.getElementById('login-error').classList.remove('hidden'); }
        }

        function login(user) {
            currentUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('current-user-display').innerText = `👤 ${user.name}`;

            document.getElementById('nav-teacher').classList.toggle('hidden', user.role !== 'teacher');
            document.getElementById('nav-captain').classList.toggle('hidden', user.role !== 'captain');
            document.getElementById('nav-student').classList.toggle('hidden', user.role === 'teacher'); 

            switchTab(user.role);
        }
        function logout() { location.reload(); }

        function switchTab(role) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`role-${role}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('bg-blue-900', 'hover:bg-blue-700'));
            document.getElementById(`nav-${role}`).classList.replace('hover:bg-blue-700', 'bg-blue-900');
            if (role === 'student') renderStudentLeaves();
            if (role === 'captain') renderRollCallList();
            if (role === 'teacher') { renderPendingLeaves(); renderUserManager(); renderStats(); }
        }

        // ================= 同學 (請假) =================
        async function submitLeave(e) {
            e.preventDefault();
            const date = document.getElementById('leave-date').value;
            if (db.leaves.find(l => l.studentId === currentUser.id && l.date === date)) return alert("⚠️ 您這天已提交過請假！");
            
            const newLeave = { id: Date.now().toString(), studentId: currentUser.id, date: date, type: document.getElementById('leave-type').value, reason: document.getElementById('leave-reason').value, status: 'pending' };
            if(await sendAction({ action: 'submitLeave', leave: newLeave })) {
                document.getElementById('leave-reason').value = ''; alert("✅ 提交成功"); renderStudentLeaves();
            }
        }

        async function revokeLeave(id) {
            if(confirm("⚠️ 確定撤回？") && await sendAction({ action: 'revokeLeave', leaveId: id })) {
                alert("✅ 已撤回"); renderStudentLeaves();
            }
        }

        function renderStudentLeaves() {
            const myLeaves = db.leaves.filter(l => l.studentId === currentUser.id).sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('student-leave-list').innerHTML = myLeaves.map(l => `
                <tr class="border-b">
                    <td class="py-3 px-4">${l.date}</td><td class="py-3 px-4"><span class="bg-gray-200 px-2 rounded">${l.type}</span></td>
                    <td class="py-3 px-4">${l.reason}</td><td class="py-3 px-4 text-center"><span class="px-2 rounded ${LEAVE_STATUS[l.status].color}">${LEAVE_STATUS[l.status].label}</span></td>
                    <td class="py-3 px-4 text-center">${l.status==='pending'?`<button onclick="revokeLeave('${l.id}')" class="text-red-500 font-bold">撤回</button>`:'-'}</td>
                </tr>`).join('') || `<tr><td colspan="5" class="py-4 text-center">無紀錄</td></tr>`;
        }

        // ================= 隊長 (點名) =================
        function renderRollCallList() {
            const dateStr = document.getElementById('rollcall-date').value;
            const dayOfWeek = new Date(dateStr).getDay(); 
            document.getElementById('day-indicator').innerText = `當值日：${DAY_NAMES[dayOfWeek]}`;
            
            // 支援多天當值判斷 (字串包含)
            const onDuty = db.users.filter(u => u.role !== 'teacher' && (u.dutyDay||'').toString().split(',').includes(dayOfWeek.toString()));

            const tbody = document.getElementById('rollcall-list');
            if (!onDuty.length) return tbody.innerHTML = `<tr><td colspan="3" class="py-8 text-center text-gray-500">該日無學生當值</td></tr>`;

            const dailyRecord = db.attendance[dateStr] || {};
            tbody.innerHTML = onDuty.map(student => {
                const status = dailyRecord[student.id];
                const hasLeave = db.leaves.some(l => l.studentId === student.id && l.date === dateStr && l.status === 'approved');
                
                if (hasLeave) return `<tr class="bg-blue-50/50 border-b" data-sid="${student.id}"><td class="py-4 px-4 font-medium">${student.name} <span class="text-sm text-gray-500">(${student.studentId})</span></td><td class="py-4 px-4 text-gray-600">${student.dutyLocation||'-'}</td><td class="py-4 px-4 text-blue-700 font-bold">🔵 已請假</td></tr>`;

                return `
                    <tr class="hover:bg-gray-50 border-b" data-sid="${student.id}">
                        <td class="py-4 px-4 font-medium">${student.name} <span class="text-sm text-gray-500">(${student.studentId||''})</span></td>
                        <td class="py-4 px-4 text-indigo-700 font-bold">${student.dutyLocation||'-'}</td>
                        <td class="py-4 px-4 flex space-x-4">
                            <label class="cursor-pointer p-2"><input type="radio" name="st-${student.id}" value="present" ${status==='present'?'checked':''} class="accent-green-600"> 出席</label>
                            <label class="cursor-pointer p-2"><input type="radio" name="st-${student.id}" value="absent" ${status==='absent'?'checked':''} class="accent-red-600"> 缺席</label>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function saveRollCall() {
            const date = document.getElementById('rollcall-date').value;
            let records = {}; let unselected = 0;

            document.querySelectorAll('#rollcall-list tr[data-sid]').forEach(tr => {
                const sid = tr.getAttribute('data-sid');
                const checked = tr.querySelector(`input[name="st-${sid}"]:checked`);
                if (tr.innerText.includes('已請假')) return; // 請假略過檢查
                if (checked) records[sid] = checked.value;
                else unselected++;
            });
            
            // 防漏點機制
            if(unselected > 0 && !confirm(`⚠️ 警告：尚有 ${unselected} 位學生未點名！\n未點名者不會被計入出席率。確定要強制儲存嗎？`)) return;

            if(await sendAction({ action: 'saveRollCall', date: date, records: records })) {
                alert(`✅ 儲存成功！`); renderRollCallList();
            }
        }

        // ================= 老師 (管理) =================
        function renderPendingLeaves() {
            const pending = db.leaves.filter(l => l.status === 'pending');
            document.getElementById('pending-count').innerText = pending.length;
            document.getElementById('teacher-pending-leaves').innerHTML = pending.map(l => {
                const u = db.users.find(x => x.id === l.studentId);
                return `<tr class="border-b"><td class="py-3 px-4 font-medium">${u?u.name:'-'}</td><td class="py-3 px-4">${l.date}</td><td class="py-3 px-4"><span class="bg-gray-200 px-2 rounded">${l.type}</span> ${l.reason}</td><td class="py-3 px-4 text-right"><button onclick="processLeave('${l.id}', 'approved', '${l.date}', '${l.studentId}')" class="bg-green-500 text-white px-3 py-1 rounded shadow mb-1">批准</button> <button onclick="processLeave('${l.id}', 'rejected', '${l.date}', '${l.studentId}')" class="bg-red-500 text-white px-3 py-1 rounded shadow">拒絕</button></td></tr>`;
            }).join('') || `<tr><td colspan="4" class="py-4 text-center">無待辦</td></tr>`;
        }

        async function processLeave(id, status, date, studentId) {
            if(await sendAction({ action: 'reviewLeave', leaveId: id, status: status, date: date, studentId: studentId })) {
                renderPendingLeaves(); renderStats();
            }
        }

        // 密碼顯示切換
        function togglePwd(id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        }

        function renderUserManager() {
            const tbody = document.getElementById('teacher-user-manager');
            tbody.innerHTML = db.users.map(u => `
                <tr class="hover:bg-gray-50 border-b user-row">
                    <td class="py-2 px-3">
                        <input type="text" id="eu-name-${u.id}" value="${u.name}" class="u-name border p-1 w-full rounded mb-1 text-sm font-medium">
                        <input type="text" id="eu-sid-${u.id}" value="${u.studentId||''}" class="u-sid border p-1 w-full rounded text-xs">
                    </td>
                    <td class="py-2 px-3">
                        <input type="text" id="eu-un-${u.id}" value="${u.username}" class="u-un border p-1 w-full rounded mb-1 text-sm">
                        <div class="flex"><input type="password" id="eu-pw-${u.id}" value="${u.password}" class="border p-1 w-full rounded-l text-sm"><button onclick="togglePwd('eu-pw-${u.id}')" class="bg-gray-200 px-2 rounded-r">👁️</button></div>
                    </td>
                    <td class="py-2 px-3">
                        <select id="eu-role-${u.id}" class="border p-1 w-full rounded bg-white text-sm mb-1"><option value="student" ${u.role=='student'?'selected':''}>同學</option><option value="captain" ${u.role=='captain'?'selected':''}>隊長</option><option value="teacher" ${u.role=='teacher'?'selected':''}>老師</option></select>
                        <div class="flex gap-1"><input type="text" id="eu-day-${u.id}" value="${u.dutyDay||''}" placeholder="星期(例:1,3)" class="border p-1 w-1/2 rounded text-xs"><input type="text" id="eu-loc-${u.id}" value="${u.dutyLocation||''}" placeholder="位置" class="border p-1 w-1/2 rounded text-xs"></div>
                    </td>
                    <td class="py-2 px-3 text-center align-middle"><button onclick="deleteUser('${u.id}')" class="text-red-600 font-bold block w-full">刪除</button></td>
                </tr>`).join('');
            filterUsers();
        }

        // 即時動態過濾 (解決修改後搜不到的問題)
        function filterUsers() {
            const kw = document.getElementById('search-user').value.toLowerCase();
            document.querySelectorAll('.user-row').forEach(row => {
                const text = (row.querySelector('.u-name').value + row.querySelector('.u-sid').value + row.querySelector('.u-un').value).toLowerCase();
                row.style.display = text.includes(kw) ? '' : 'none';
            });
        }

        async function saveAllUsers() {
            let updatedUsers = [];
            db.users.forEach(u => {
                const n = document.getElementById(`eu-name-${u.id}`);
                if (n) updatedUsers.push({ id: u.id, name: n.value.trim(), studentId: document.getElementById(`eu-sid-${u.id}`).value.trim(), username: document.getElementById(`eu-un-${u.id}`).value.trim(), password: document.getElementById(`eu-pw-${u.id}`).value.trim(), role: document.getElementById(`eu-role-${u.id}`).value, dutyDay: document.getElementById(`eu-day-${u.id}`).value.trim(), dutyLocation: document.getElementById(`eu-loc-${u.id}`).value.trim() });
            });
            if(await sendAction({ action: 'saveUsers', users: updatedUsers })) {
                alert(`✅ 帳號資料已安全儲存！`); renderStats();
            }
        }

        async function addUser() {
            const role = document.getElementById('n-role').value; const name = document.getElementById('n-name').value.trim(); const sid = document.getElementById('n-sid').value.trim(); const un = document.getElementById('n-un').value.trim(); const pw = document.getElementById('n-pw').value.trim(); const day = document.getElementById('n-day').value; const loc = document.getElementById('n-loc').value;
            if(!name || !un || !pw) return alert("必填不足！");
            
            // 先抓取最新資料檢查帳號是否重複
            await fetchLatestData();
            if(db.users.find(u => u.username === un)) return alert("帳號已存在！");
            
            db.users.push({ id: 'u_'+Date.now(), name, username: un, password: pw, role, studentId: sid, dutyDay: day, dutyLocation: loc });
            if(await sendAction({ action: 'saveUsers', users: db.users })) {
                renderUserManager(); ['n-name','n-sid','n-un','n-pw','n-day','n-loc'].forEach(id => document.getElementById(id).value = '');
            }
        }

        async function deleteUser(id) {
            if(db.users.filter(u=>u.role==='teacher').length <= 1 && db.users.find(u=>u.id===id).role === 'teacher') return alert("需保留至少一名老師！");
            if(confirm("確定刪除？") && await sendAction({ action: 'saveUsers', users: db.users.filter(x => x.id !== id) })) {
                renderUserManager(); renderStats();
            }
        }

        // 統計相關
        function toggleStatInputs() {
            const m = document.getElementById('stat-mode').value;
            ['stat-month','stat-year','stat-range-group'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if(m==='month') document.getElementById('stat-month').classList.remove('hidden');
            else if(m==='year') document.getElementById('stat-year').classList.remove('hidden');
            else document.getElementById('stat-range-group').classList.replace('hidden','flex');
        }

        function renderStats() {
            const mode = document.getElementById('stat-mode').value;
            const dates = Object.keys(db.attendance).filter(d => {
                if(mode==='month') return d.startsWith(document.getElementById('stat-month').value);
                if(mode==='year') return d.startsWith(document.getElementById('stat-year').value);
                const mStr = d.substring(0,7); return mStr >= document.getElementById('stat-start').value && mStr <= document.getElementById('stat-end').value;
            });

            const targets = db.users.filter(u => u.role !== 'teacher');
            document.getElementById('teacher-stats-list').innerHTML = targets.map(u => {
                let p = 0, a = 0, l = 0;
                dates.forEach(d => {
                    const st = db.attendance[d][u.id];
                    if (st==='present') p++; else if (st==='absent') a++; else if (st==='leave') l++;
                });
                let valid = p + a; let rate = valid > 0 ? Math.round((p/valid)*100) : (l>0?100:0);
                if(p===0 && a===0 && l===0) return '';
                return `<tr class="border-b"><td class="py-3 px-4">${u.name} <span class="text-xs text-gray-500">(${u.studentId||''})</span></td><td class="py-3 px-4">${valid}</td><td class="py-3 px-4 text-green-600 font-bold">${p}</td><td class="py-3 px-4 text-blue-600">${l}</td><td class="py-3 px-4 text-red-600">${a}</td><td class="py-3 px-4 font-bold ${rate<80?'text-red-600':''}">${rate}%</td></tr>`;
            }).join('') || `<tr><td colspan="6" class="py-6 text-center">此區間無數據</td></tr>`;
        }

        function exportCSV() {
            let csv = `\uFEFF班別(學號),姓名,應到(有紀錄)日數,出席,請假,缺席,出席率\n`;
            document.querySelectorAll('#teacher-stats-list tr').forEach(tr => {
                if(tr.cells.length > 1) csv += Array.from(tr.cells).map(c => c.innerText.replace(/\n/g,' ')).join(',') + '\n';
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = `出席累積統計.csv`; link.click();
        }
    </script>
</body>
</html>
